apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: marcuscarlbom/auth-service:latest
          ports:
            - containerPort: 8101
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27420"
            - name: MONGO_DB
              value: "auth_service"
            - name: JWT_SECRET
              value: "super_safe_no_leakage_key_67"
            - name: FLASK_DEBUG
              value: "false"
