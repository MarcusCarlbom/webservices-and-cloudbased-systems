apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
        - name: url-shortener
          image: marcuscarlbom/url-shortener:latest
          ports:
            - containerPort: 8100
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27420"
            - name: MONGO_DB
              value: "url_shortening_service"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8101"
            - name: FLASK_DEBUG
              value: "false"
